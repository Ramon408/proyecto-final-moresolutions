<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="pantalla-login">
    <form class="login" action="inicio.html">
      <div>
        <div class="login-escuela">[NOMBRE DEL COLEGIO]</div>
        <h1>Ingresar</h1>
      </div>
      <label class="campo">Usuario
        <input type="text" name="usuario" placeholder="usuario">
      </label>
      <label class="campo">Contraseña
        <input type="password" name="password" placeholder="••••••">
      </label>
      <button type="submit" class="boton boton-oscuro">Ingresar</button>
      <p class="nota-al-pie">Según el rol del usuario (administrador, directivo, preceptor o docente) se habilitan distintos módulos.</p>
    </form>
  </div>
</body>
</html>
