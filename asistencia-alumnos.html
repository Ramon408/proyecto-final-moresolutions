<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toma de asistencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body data-pagina="asistencia-alumnos">
  <div class="app">
    <nav class="menu" aria-label="Menú principal">
      <div class="menu-escuela">Escuela Técnica N.º 4</div>
      <a href="inicio.html">Inicio</a>
      <a href="planes.html">Planes de estudio</a>
      <a href="cursos.html">Cursos y asignaciones</a>
      <a data-roles="administrador,directivo,preceptor" href="asistencia-docentes.html">Asistencia docente</a>
      <a href="asistencia-alumnos.html" class="activo" aria-current="page">Asistencia alumnos</a>
      <a data-roles="administrador,directivo,docente" href="calificaciones.html">Calificaciones</a>
      <a data-roles="administrador" href="admin-bd.html" class="admin">Admin BD</a>
      <a href="index.html" class="salir">Cerrar sesión</a>
    </nav>

    <div class="contenido">
      <header class="encabezado">
        <h1>Toma de asistencia</h1>
        <div class="encabezado-acciones">

        </div>
      </header>

      <main>
        <form id="form-lista" class="columna-principal" style="gap: 20px;">
          <div class="grilla-4">
            <label class="campo">Curso<select name="id_curso"></select></label>
            <label class="campo">Materia<select name="id_dictado"></select></label>
            <label class="campo">Fecha de la clase<input type="date" name="fecha" required></label>
            <label class="campo">Tema dado<input type="text" name="tema" maxlength="200"></label>
          </div>

          <p class="ayuda" id="estado-lista"></p>

          <p class="mensaje oculto" id="mensaje-lista" role="status"></p>

          <div class="tabla-scroll">
            <table id="tabla-lista">
              <thead>
                <tr><th>Alumno</th><th class="centro">Presente</th><th class="centro">Ausente</th><th class="centro">Tarde</th><th class="centro">Justificado</th><th>Asistencia acumulada</th></tr>
              </thead>
              <tbody>
              </tbody>
            </table>
          </div>

          <div class="fila">
            <button type="button" class="boton" style="font-weight: 400;" id="btn-todos-presentes">Marcar todos presentes</button>
            <button type="submit" class="boton boton-oscuro">Guardar lista</button>
          </div>
        </form>
      </main>
    </div>
  </div>
</body>
</html>
