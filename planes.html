<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planes de estudio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body data-pagina="planes">
  <div class="app">
    <nav class="menu" aria-label="Menú principal">
      <div class="menu-escuela">Escuela Técnica N.º 4</div>
      <a href="inicio.html">Inicio</a>
      <a href="planes.html" class="activo" aria-current="page">Planes de estudio</a>
      <a href="cursos.html">Cursos y asignaciones</a>
      <a data-roles="administrador,directivo,preceptor" href="asistencia-docentes.html">Asistencia docente</a>
      <a href="asistencia-alumnos.html">Asistencia alumnos</a>
      <a data-roles="administrador,directivo,docente" href="calificaciones.html">Calificaciones</a>
      <a data-roles="administrador" href="admin-bd.html" class="admin">Admin BD</a>
      <a href="index.html" class="salir">Cerrar sesión</a>
    </nav>

    <div class="contenido">
      <header class="encabezado">
        <h1>Planes de estudio</h1>
        <div class="encabezado-acciones">
          <button type="button" class="boton boton-oscuro" id="btn-nuevo-plan" data-roles="administrador,directivo">+ Nuevo plan</button>
        </div>
      </header>

      <main class="columnas">
        <div class="columna-lateral" style="width: 260px;">
          <div class="subtitulo">Planes cargados</div>
          <div id="lista-planes" class="columna-lateral" style="width: 100%;">
          </div>

          <form class="caja-punteada oculto" id="form-plan">
            <div class="subtitulo">Nuevo plan</div>
            <label class="campo">Nombre<input type="text" name="nombre" required></label>
            <label class="campo">Resolución<input type="text" name="resolucion"></label>
            <label class="campo">Vigente desde<input type="number" name="anio_vigencia" min="2000" max="2100" value="2026"></label>
            <div class="fila">
              <button type="submit" class="boton boton-oscuro">Guardar</button>
              <button type="button" class="boton" id="btn-cancelar-plan">Cancelar</button>
            </div>
          </form>
        </div>

        <div class="columna-principal">
          <p class="mensaje oculto" id="mensaje-planes" role="status"></p>
          <div class="fila" role="group" aria-label="Filtrar por año">
              <button type="button" class="boton boton-chico filtro-anio" data-anio="1">1.º año</button>
              <button type="button" class="boton boton-chico filtro-anio" data-anio="2">2.º año</button>
              <button type="button" class="boton boton-chico filtro-anio" data-anio="3">3.º año</button>
              <button type="button" class="boton boton-chico filtro-anio" data-anio="4">4.º año</button>
              <button type="button" class="boton boton-chico filtro-anio" data-anio="5">5.º año</button>
              <button type="button" class="boton boton-chico filtro-anio" data-anio="6">6.º año</button>
              <button type="button" class="boton boton-chico filtro-anio" data-anio="7">7.º año</button>
          </div>
          <div class="fila-entre">
            <div class="subtitulo" id="titulo-anio">Materias de 1.º año</div>
            <button type="button" class="boton" id="btn-agregar-materia" data-roles="administrador,directivo">+ Agregar materia</button>
          </div>

          <form class="caja-punteada oculto" id="form-materia">
            <div class="subtitulo" id="titulo-form-materia">Nueva materia</div>
            <div class="grilla-3">
              <label class="campo">Nombre<input type="text" name="nombre" required></label>
              <label class="campo">Año<select name="anio"><option value="1">1.º</option><option value="2">2.º</option><option value="3">3.º</option><option value="4">4.º</option><option value="5">5.º</option><option value="6">6.º</option><option value="7">7.º</option></select></label>
              <label class="campo">Carga horaria semanal (hs)<input type="number" name="carga_horaria" min="1" max="20" required></label>
            </div>
            <div class="fila">
              <button type="submit" class="boton boton-oscuro">Guardar</button>
              <button type="button" class="boton" id="btn-cancelar-materia">Cancelar</button>
            </div>
          </form>

          <div class="tabla-scroll">
            <table id="tabla-materias">
              <thead>
                <tr><th>Materia</th><th>Año</th><th>Carga horaria semanal</th><th data-roles="administrador,directivo">Acciones</th></tr>
              </thead>
              <tbody>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
