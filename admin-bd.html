<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración de la base de datos</title>
</head>
<body>
  <h1>Panel de administración de la base de datos</h1>

  <form id="form-acceso" hidden>
    <p>Ingresá con el usuario de administración.</p>
    <p><label>Usuario <input type="text" name="usuario" autocomplete="username"></label></p>
    <p><label>Contraseña <input type="password" name="password" autocomplete="current-password"></label></p>
    <p><button type="submit">Entrar</button> <a href="inicio.html">Volver al sistema</a></p>
    <p id="error-acceso" hidden></p>
  </form>

  <div id="panel" hidden>
    <p>Conectado como: <span id="usuario-admin"></span> · <a href="inicio.html">Volver al sistema</a> · <a href="#" id="salir">Salir</a></p>
    <hr>
    <p id="mensaje" hidden></p>
    <table>
      <tr>
        <td valign="top" width="220">
          <b>Tablas</b>
          <ul id="lista-tablas"></ul>
        </td>
        <td valign="top">
          <p><b id="titulo-tabla"></b></p>
          <table border="1" cellpadding="4" cellspacing="0" id="tabla-datos"></table>
          <p><b id="titulo-form">Nuevo registro</b></p>
          <form id="form-registro"></form>
        </td>
      </tr>
    </table>
  </div>

  <script>
    
    let tablaActual = 'docente';
    let datos = null;        
    let idEditando = null;

    const $ = id => document.getElementById(id);
    const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function api(url, opciones = {}) {
      let r;
      try {
        r = await fetch(url, {
          method: opciones.method || 'GET',
          credentials: 'same-origin',
          headers: opciones.body ? { 'Content-Type': 'application/json' } : {},
          body: opciones.body ? JSON.stringify(opciones.body) : undefined,
        });
      } catch {
        throw new Error('No se pudo conectar con el servidor. Abrí el sistema desde http://localhost con Apache y MySQL iniciados.');
      }
      const json = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(json.error || 'Error del servidor.');
      return json;
    }

    function mensaje(texto) {
      $('mensaje').innerHTML = '<b>' + esc(texto) + '</b>';
      $('mensaje').hidden = false;
    }

    async function mostrarPanel(usuario) {
      $('form-acceso').hidden = true;
      $('panel').hidden = false;
      $('usuario-admin').textContent = usuario.username;
      await dibujarLista();
      await dibujarTabla();
    }

    api('api/sesion.php')
      .then(u => (u.rol === 'administrador' ? mostrarPanel(u) : Promise.reject()))
      .catch(() => { $('form-acceso').hidden = false; });

    $('form-acceso').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target;
      try {
        const u = await api('api/sesion.php', { method: 'POST', body: { usuario: f.usuario.value, password: f.password.value } });
        if (u.rol !== 'administrador') throw new Error('Solo el usuario administrador puede entrar a este panel.');
        await mostrarPanel(u);
      } catch (err) {
        $('error-acceso').innerHTML = '<b>' + esc(err.message) + '</b>';
        $('error-acceso').hidden = false;
      }
    });

    $('salir').addEventListener('click', async e => {
      e.preventDefault();
      await api('api/sesion.php', { method: 'DELETE' }).catch(() => {});
      window.location.reload();
    });

    async function dibujarLista() {
      const tablas = await api('api/admin.php');
      $('lista-tablas').innerHTML = tablas.map(t =>
        `<li><a href="#" data-tabla="${t.tabla}">${t.tabla === tablaActual ? '<b>' + t.tabla + '</b>' : t.tabla}</a> (${t.registros})</li>`).join('');
    }

    async function dibujarTabla() {
      datos = await api('api/admin.php?tabla=' + tablaActual);
      $('titulo-tabla').textContent = `Tabla: ${tablaActual} (${datos.filas.length} registros)`;
      const cabecera = '<tr>' + datos.columnas.map(c => `<th>${c.nombre}</th>`).join('') + '<th></th></tr>';
      const filas = datos.filas.map(f => '<tr>' + datos.columnas.map(c => `<td>${f[c.nombre] === null ? 'NULL' : esc(f[c.nombre])}</td>`).join('') +
        `<td><a href="#" data-editar="${f[datos.clave]}">editar</a> <a href="#" data-borrar="${f[datos.clave]}">borrar</a></td></tr>`).join('');
      $('tabla-datos').innerHTML = cabecera + filas;
      idEditando = null;
      dibujarFormulario();
    }

    function dibujarFormulario(fila) {
      $('titulo-form').textContent = fila ? `Editar registro ${datos.clave} = ${fila[datos.clave]}` : 'Nuevo registro';
      
      const campos = datos.columnas.slice(1).map(c =>
        `${c.nombre} <input type="text" name="${c.nombre}" value="${fila && fila[c.nombre] !== null ? esc(fila[c.nombre]) : ''}" placeholder="${c.tipo}${c.nulo ? ' (opcional)' : ''}"><br>`).join('');
      const ayuda = tablaActual === 'usuario' ? '<p>En password_hash podés escribir una contraseña nueva: se guarda cifrada.</p>' : '';
      $('form-registro').innerHTML = campos + ayuda +
        '<button type="submit">Guardar</button>' + (fila ? ' <button type="button" id="cancelar">Cancelar</button>' : '');
    }

    $('lista-tablas').addEventListener('click', async e => {
      const t = e.target.closest('[data-tabla]');
      if (!t) return;
      e.preventDefault();
      tablaActual = t.dataset.tabla;
      $('mensaje').hidden = true;
      await dibujarLista();
      await dibujarTabla();
    });

    $('tabla-datos').addEventListener('click', async e => {
      if (e.target.dataset.borrar !== undefined) {
        e.preventDefault();
        if (!confirm('¿Borrar este registro?')) return;
        try {
          await api(`api/admin.php?tabla=${tablaActual}&id=${e.target.dataset.borrar}`, { method: 'DELETE' });
          mensaje('Registro borrado.');
          await dibujarLista();
          await dibujarTabla();
        } catch (err) {
          mensaje(err.message);
        }
      }
      if (e.target.dataset.editar !== undefined) {
        e.preventDefault();
        idEditando = e.target.dataset.editar;
        dibujarFormulario(datos.filas.find(f => String(f[datos.clave]) === idEditando));
      }
    });

    $('form-registro').addEventListener('click', e => {
      if (e.target.id === 'cancelar') { idEditando = null; dibujarFormulario(); }
    });

    $('form-registro').addEventListener('submit', async e => {
      e.preventDefault();
      const valores = {};
      datos.columnas.slice(1).forEach(c => { valores[c.nombre] = e.target[c.nombre].value; });
      try {
        if (idEditando !== null) {
          await api(`api/admin.php?tabla=${tablaActual}&id=${idEditando}`, { method: 'PUT', body: { datos: valores } });
          mensaje('Registro actualizado.');
        } else {
          await api('api/admin.php?tabla=' + tablaActual, { method: 'POST', body: { datos: valores } });
          mensaje('Registro agregado.');
        }
        await dibujarLista();
        await dibujarTabla();
      } catch (err) {
        mensaje(err.message);
      }
    });
  </script>
</body>
</html>
